<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>square frame</title>
<style>
  /* A 1080x1080 transparent overlay: the paper bands above and below the
     16:9 video in the square cut are dead space, so brand them. Rendered
     with omitBackground so only the type is composited. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;background:transparent;overflow:hidden}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#23201A;position:relative}
  .top{position:absolute;top:0;left:0;right:0;height:236px;
       display:flex;align-items:center;justify-content:center;gap:16px}
  .top svg{width:44px;height:44px;image-rendering:pixelated}
  .word{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
        font-size:38px;letter-spacing:-.01em}
  .bot{position:absolute;bottom:0;left:0;right:0;height:236px;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .url{font-size:34px;color:#D9480F;font-weight:500}
  .sub{font-size:17px;color:#6F6A5E;letter-spacing:.03em}
</style>
</head>
<body>
  <div class="top">
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="1" width="14" height="1" fill="#23201A"/>
      <rect x="1" y="2" width="14" height="3" fill="#D9480F"/>
      <rect x="3" y="2" width="2" height="3" fill="#F2EFE7"/>
      <rect x="7" y="2" width="2" height="3" fill="#F2EFE7"/>
      <rect x="11" y="2" width="2" height="3" fill="#F2EFE7"/>
      <rect x="2" y="5" width="2" height="1" fill="#D9480F"/>
      <rect x="6" y="5" width="2" height="1" fill="#D9480F"/>
      <rect x="10" y="5" width="2" height="1" fill="#D9480F"/>
      <rect x="1" y="5" width="1" height="9" fill="#23201A"/>
      <rect x="14" y="5" width="1" height="9" fill="#23201A"/>
      <rect x="3" y="9" width="10" height="5" fill="#23201A"/>
      <rect x="4" y="10" width="8" height="3" fill="#F2EFE7"/>
      <rect x="5" y="11" width="3" height="1" fill="#B08D2E"/>
      <rect x="9" y="11" width="2" height="1" fill="#B08D2E"/>
    </svg>
    <span class="word">FounderFloor</span>
  </div>
  <div class="bot">
    <div class="url">founderfloor.net</div>
    <div class="sub">Free &middot; runs in your browser &middot; nothing to install</div>
  </div>
</body>
</html>
